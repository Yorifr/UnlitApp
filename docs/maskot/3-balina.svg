<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" data-name="Balina">
  <!-- Balina maskot: nefes almak için yüzeye çıkıp başından SU fışkırtan nane renkli balina. -->
  <!-- Hafif 3/4 açıyla sağa (konuşma balonuna) bakar. Kuyruğu sol arkada yukarı kalkıktır. -->
  <!-- Renkler (uygulamanın nane paleti): gövde #2EC4B6, koyu ton #1A9C90, karın #C9F3EC, su #4F8DF9 / #9DC4FF -->
  <!-- EKİP KURALI 1: Fıskiye her zaman SUDUR: katı, doygun mavi. Asla beyaz, gri, yarı saydam
       ya da bulut/puf biçiminde çizilmez; canlandırmada duman gibi kıvrılarak yükselmez.
       Zerreler hep yukarı ve dışa saçılır, başın yanından aşağı süzülmez (ter/gözyaşı gibi durmasın). -->
  <!-- EKİP KURALI 2: Uygulamada maskotun adı her zaman "Nefes". Hiçbir metinde "mavi balina"
       ifadesi ya da boyut/kilo şakası kullanılmaz. -->

  <!-- Yer gölgesi -->
  <ellipse cx="102" cy="186" rx="66" ry="7" fill="#000000" opacity="0.10"/>

  <!-- Kuyruk: gövdenin sol altından çıkıp yukarı kıvrılır, iki loblu yüzgeçle biter -->
  <!-- Önce koyu alt ton (koyu zeminde kenar belli olsun), sonra kuyruğun kendisi -->
  <g fill="#1A9C90" transform="translate(0 4)">
    <path d="M72 176 C48 182 24 174 18 152 C15 141 17 131 22 124 L34 126 C30 136 30 146 36 154 C42 161 56 164 72 162 Z"/>
    <path d="M26 128 C15 128 8 119 8 106 C8 103 10 102 13 103 C19 105 24 111 26 117 C28 111 33 105 39 103 C42 102 44 103 44 106 C44 119 37 128 26 128 Z"/>
  </g>
  <g fill="#27B8AA">
    <path d="M72 176 C48 182 24 174 18 152 C15 141 17 131 22 124 L34 126 C30 136 30 146 36 154 C42 161 56 164 72 162 Z"/>
    <path d="M26 128 C15 128 8 119 8 106 C8 103 10 102 13 103 C19 105 24 111 26 117 C28 111 33 105 39 103 C42 102 44 103 44 106 C44 119 37 128 26 128 Z"/>
  </g>

  <!-- Yüzgeçler: kutlamada ikisi de havada (gövdenin arkasında) -->
  <g class="mood-cheer" fill="#1A9C90">
    <path d="M0 -3 C6 -3 9 6 10 16 C11 28 7 37 -1 37 C-8 37 -11 29 -10 18 C-9 7 -6 -3 0 -3 Z" transform="translate(62 104) rotate(156)"/>
    <path d="M0 -3 C6 -3 9 6 10 16 C11 28 7 37 -1 37 C-8 37 -11 29 -10 18 C-9 7 -6 -3 0 -3 Z" transform="translate(164 102) rotate(-150)"/>
  </g>
  <!-- Öndeki yüzgeç: neşeli ve sakin halde aşağıda, yana açık -->
  <path class="mood-happy mood-calm" d="M0 -3 C6 -3 9 6 10 16 C11 28 7 37 -1 37 C-8 37 -11 29 -10 18 C-9 7 -6 -3 0 -3 Z" fill="#1A9C90" transform="translate(163 140) rotate(-42)"/>

  <!-- ===== Fıskiye (SU). Gövdenin arkasında çizilir, tabanı başın içinde gizli kalır ===== -->
  <!-- Neşeli: orta boy su sıçraması (incelen su kolları + yuvarlak zerreler) -->
  <g class="mood-happy hide-acc-bere hide-acc-kep" fill="#4F8DF9">
    <path d="M100.5 76 C100 64 99 54 101 46 C102 42 108 41 110 45 C112 52 112 64 111.5 76 Z"/>
    <path d="M104 48 C96 30 78 28 70 42 C69 45 72 47 74 45 C81 37 93 38 99 53 Z"/>
    <path d="M106 47 C111 34 124 31 131 40 C132 42 130 44 128 43 C122 38 115 40 111 52 Z"/>
    <circle cx="103" cy="31" r="6"/>
    <circle cx="79" cy="25" r="5"/>
    <circle cx="122" cy="24" r="4.2"/>
    <circle cx="139" cy="33" r="3.6"/>
  </g>
  <path class="mood-happy hide-acc-bere hide-acc-kep" d="M104 66 L104 52" stroke="#9DC4FF" stroke-width="4" stroke-linecap="round"/>
  <!-- Kutlama: büyük su sıçraması -->
  <g class="mood-cheer hide-acc-bere hide-acc-kep" fill="#4F8DF9">
    <path d="M100 76 C99.5 62 98.5 50 100.5 40 C101.5 35 108.5 34 110.5 39 C113 48 112.5 62 112 76 Z"/>
    <path d="M103.5 42 C94 20 70 18 60 36 C59 39 62 41 64.5 39 C73 28 90 30 98 48 Z"/>
    <path d="M107 41 C113 25 131 21 141 33 C142.5 35 140.5 37.5 138 36.5 C130 30 118 33 112 47 Z"/>
    <circle cx="102" cy="22" r="6.5"/>
    <circle cx="70" cy="15" r="5.5"/>
    <circle cx="124" cy="14" r="4.8"/>
    <circle cx="151" cy="23" r="4.2"/>
    <circle cx="50" cy="27" r="4"/>
  </g>
  <path class="mood-cheer hide-acc-bere hide-acc-kep" d="M104 68 L104 46" stroke="#9DC4FF" stroke-width="4" stroke-linecap="round"/>
  <!-- Düşünceli: küçük fıskiye (kısa su + tek kol + iki zerre) -->
  <g class="mood-think hide-acc-bere hide-acc-kep" fill="#4F8DF9">
    <path d="M101.5 76 C101 68 100.5 61 102 56 C103 53 108 53 109 56 C110.5 61 110.5 68 110 76 Z"/>
    <path d="M103.5 58 C99 48 89 47 85 54 C84.5 56 86.5 57.5 88 56 C92 51 98 53 101 61 Z"/>
    <circle cx="106" cy="45" r="4.5"/>
    <circle cx="117" cy="50" r="3.5"/>
  </g>
  <!-- Sakin: sadece üç minik su zerresi (yumuşak bir nefes işareti) -->
  <g class="mood-calm hide-acc-bere hide-acc-kep" fill="#7FB0FF">
    <circle cx="106" cy="56" r="3.6"/>
    <circle cx="97" cy="47" r="2.9"/>
    <circle cx="115" cy="45" r="2.6"/>
  </g>

  <!-- Gövde: önce 5 birim aşağı kaymış koyu alt ton, sonra gövde. Damla biçimli, kuyruğa doğru incelir -->
  <path d="M112 66 C150 66 172 92 172 124 C172 160 146 182 110 182 C86 182 64 179 48 170 C38 164 34 154 38 142 C42 128 50 112 58 96 C68 76 88 66 112 66 Z" fill="#1A9C90" transform="translate(0 5)"/>
  <path d="M112 66 C150 66 172 92 172 124 C172 160 146 182 110 182 C86 182 64 179 48 170 C38 164 34 154 38 142 C42 128 50 112 58 96 C68 76 88 66 112 66 Z" fill="#2EC4B6"/>
  <!-- Başın üstünde parlaklık (bere ve kep takılınca gizlenir) -->
  <ellipse class="hide-acc-bere hide-acc-kep" cx="0" cy="0" rx="13" ry="6.5" fill="#FFFFFF" opacity="0.35" transform="translate(84 86) rotate(-38)"/>

  <!-- Karın: gövdenin alt kenarına yaslı açık bant + balinaların boğaz olukları (kısa dikey çizgiler) -->
  <path d="M60 168 C80 156 128 150 167 146 C164 166 142 182 110 182 C90 182 72 177 60 168 Z" fill="#C9F3EC"/>
  <g fill="none" stroke="#9FE0D5" stroke-width="3.5" stroke-linecap="round">
    <path d="M98 161 L100 173"/>
    <path d="M112 158 L113 173"/>
    <path d="M126 156 L126 171"/>
    <path d="M140 154 L139 167"/>
  </g>

  <!-- Yanaklar (saydam değil, düz açık pembe) -->
  <ellipse cx="83" cy="130" rx="8" ry="5" fill="#FFB0BE"/>
  <ellipse cx="154" cy="130" rx="8" ry="5" fill="#FFB0BE"/>

  <!-- Açık gözler: beyaz + büyük göz bebeği (iki göz eşit) -->
  <g class="mood-happy mood-cheer mood-think" fill="#FFFFFF">
    <ellipse cx="96" cy="110" rx="12" ry="13.5"/>
    <ellipse cx="140" cy="110" rx="12" ry="13.5"/>
  </g>
  <g class="mood-happy mood-cheer">
    <ellipse cx="97.5" cy="112" rx="8.5" ry="10" fill="#233A3A"/>
    <ellipse cx="141.5" cy="112" rx="8.5" ry="10" fill="#233A3A"/>
    <circle cx="94.5" cy="108" r="3.4" fill="#FFFFFF"/>
    <circle cx="138.5" cy="108" r="3.4" fill="#FFFFFF"/>
  </g>
  <!-- Düşünürken gözler yana ve biraz yukarı bakar (üstte beyaz payı kalır) -->
  <g class="mood-think">
    <ellipse cx="99.5" cy="109.5" rx="8" ry="9.5" fill="#233A3A"/>
    <ellipse cx="143.5" cy="109.5" rx="8" ry="9.5" fill="#233A3A"/>
    <circle cx="97" cy="106" r="3.2" fill="#FFFFFF"/>
    <circle cx="141" cy="106" r="3.2" fill="#FFFFFF"/>
  </g>
  <!-- Kapalı, huzurlu gözler -->
  <g class="mood-calm" fill="none" stroke="#233A3A" stroke-width="6.5" stroke-linecap="round">
    <path d="M85 113 Q96 101 107 113"/>
    <path d="M129 113 Q140 101 151 113"/>
  </g>

  <!-- Ağızlar -->
  <path class="mood-happy" d="M108 127 Q118 138 128 127" fill="none" stroke="#233A3A" stroke-width="5" stroke-linecap="round"/>
  <path class="mood-calm" d="M111 128 Q118 134 125 128" fill="none" stroke="#233A3A" stroke-width="6" stroke-linecap="round"/>
  <g class="mood-cheer">
    <path d="M105 122 Q118 126 131 122 Q128 145 118 145 Q108 145 105 122 Z" fill="#8A2E3B"/>
    <ellipse cx="118" cy="139" rx="7" ry="4" fill="#FF8A9A"/>
  </g>
  <!-- Düşünürken "hmm" gülümsemesi: küçük, yana kaymış, yukarı kıvrık -->
  <path class="mood-think" d="M110 129 Q118 132 126 126" fill="none" stroke="#233A3A" stroke-width="5" stroke-linecap="round"/>

  <!-- Atkı: çenenin altından geçer (kutlama ağzıyla arasında 8 birimden fazla boşluk), uçları gövdenin içinde yuvarlak biter -->
  <g class="acc-atki">
    <path d="M44 138 Q110 172 167 135 C170 138 170 145 165 150 Q110 188 46 154 C41 150 40 142 44 138 Z" fill="#B27CF7"/>
    <path d="M48 146 Q110 180 164 142" fill="none" stroke="#D9BEFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M78 160 L96 164 L93 181 Q84 184 75 179 Z" fill="#9A5FEA"/>
    <path d="M77 168 L95 171" stroke="#D9BEFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M76 175 L94 177" stroke="#D9BEFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Düşünürken öndeki yüzgeç: alttan gelip çeneye dokunur (gövdeden ayrılsın diye koyu kenarlı) -->
  <path class="mood-think" d="M0 -3 C6 -3 9 6 10 16 C11 28 7 37 -1 37 C-8 37 -11 29 -10 18 C-9 7 -6 -3 0 -3 Z" fill="#1A9C90" stroke="#14857A" stroke-width="2.5" transform="translate(151 166) rotate(132)"/>

  <!-- Kutlama parıltıları -->
  <g class="mood-cheer" fill="#FFC21A">
    <path d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z" transform="translate(32 54)"/>
    <path d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7 Z" transform="translate(178 46) scale(0.8)"/>
  </g>

  <!-- ===== Baş aksesuarları ===== -->
  <!-- Güneş gözlüğü: neşeli ve kutlamada gözlerin üstünde -->
  <g class="acc-gozluk mood-happy mood-cheer">
    <path d="M80 106 L56 102" stroke="#2457D6" stroke-width="4" stroke-linecap="round"/>
    <path d="M156 106 L166 104" stroke="#2457D6" stroke-width="4" stroke-linecap="round"/>
    <path d="M112 106 Q118 101 124 106" fill="none" stroke="#2457D6" stroke-width="4.5"/>
    <rect x="80" y="97" width="32" height="26" rx="10" fill="#233A3A" stroke="#2457D6" stroke-width="3"/>
    <rect x="124" y="97" width="32" height="26" rx="10" fill="#233A3A" stroke="#2457D6" stroke-width="3"/>
    <path d="M87 111 L95 103" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <path d="M131 111 L139 103" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  </g>
  <!-- Güneş gözlüğü: sakin ve düşünceli halde alna itilmiş, gözler görünsün.
       Camlar burada parlak mavi: küçük boyda ikinci bir göz çifti gibi durmasın. -->
  <g class="acc-gozluk mood-calm mood-think" transform="translate(25.5 0.5) scale(0.75)">
    <path d="M80 106 L56 102" stroke="#2457D6" stroke-width="4" stroke-linecap="round"/>
    <path d="M156 106 L166 104" stroke="#2457D6" stroke-width="4" stroke-linecap="round"/>
    <path d="M112 106 Q118 101 124 106" fill="none" stroke="#2457D6" stroke-width="4.5"/>
    <rect x="80" y="97" width="32" height="26" rx="10" fill="#3B6FE0" stroke="#2457D6" stroke-width="3"/>
    <rect x="124" y="97" width="32" height="26" rx="10" fill="#3B6FE0" stroke="#2457D6" stroke-width="3"/>
    <path d="M87 111 L95 103" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M131 111 L139 103" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Kulaklık: bant başın üstünden (siluetin dışından) geçer, kaplar yanlarda -->
  <g class="acc-kulaklik">
    <path d="M54 104 C50 74 74 61 112 61 C150 61 172 78 170 104" fill="none" stroke="#B27CF7" stroke-width="7" stroke-linecap="round"/>
    <rect x="42" y="97" width="18" height="30" rx="8" fill="#9A5FEA"/>
    <rect x="161" y="97" width="18" height="30" rx="8" fill="#9A5FEA"/>
    <rect x="44" y="102" width="8" height="20" rx="4" fill="#D9BEFF"/>
    <rect x="169" y="102" width="8" height="20" rx="4" fill="#D9BEFF"/>
  </g>

  <!-- Bere takılıyken kutlamada su, berenin tepesinden fışkırır (ponponun yerine) -->
  <g class="acc-bere mood-cheer" fill="#4F8DF9">
    <path d="M105 46 C104.5 40 104 34 105.5 29 C106.5 26 111.5 26 112.5 29 C114 34 113.5 40 113 46 Z"/>
    <path d="M107 30 C102 18 88 16 82 25 C81.5 27 83.5 28.5 85 27.5 C90 22 99 23 104 34 Z"/>
    <path d="M110 29.5 C114 20 125 18 131 24 C132 25.5 130.5 27.5 128.5 26.5 C124 23 117 24 113.5 33 Z"/>
    <circle cx="108" cy="17" r="5"/>
    <circle cx="78" cy="15" r="3.8"/>
    <circle cx="136" cy="15" r="3.5"/>
  </g>
  <!-- Bere: kubbe + örgü kenar bandı (bandın alt kenarı gözlerden en az 6 birim yukarıda) -->
  <g class="acc-bere">
    <path d="M64 86 C58 30 162 26 160 86 Z" fill="#B27CF7"/>
    <path d="M59 93 Q112 84 165 93 C168 89 166 82 156 77 Q112 63 68 77 C58 82 56 89 59 93 Z" fill="#9A5FEA"/>
    <g stroke="#B27CF7" stroke-width="3" stroke-linecap="round">
      <path d="M74 79 L74 87"/>
      <path d="M93 75 L93 85"/>
      <path d="M112 74 L112 85"/>
      <path d="M131 75 L131 85"/>
      <path d="M150 79 L150 87"/>
    </g>
  </g>
  <circle class="acc-bere mood-happy mood-calm mood-think" cx="110" cy="40" r="9" fill="#D9BEFF"/>

  <!-- Mezuniyet kepi: neşeli, sakin, düşünceli halde başta -->
  <g class="acc-kep mood-happy mood-calm mood-think">
    <path d="M64 84 C64 60 160 58 160 84 Q112 96 64 84 Z" fill="#2457D6"/>
    <polygon points="112,36 172,52 112,68 52,52" fill="#3D7BF7"/>
    <circle cx="112" cy="52" r="3.5" fill="#FFC21A"/>
    <path d="M112 52 L164 56 L166 74" fill="none" stroke="#FFC21A" stroke-width="3" stroke-linecap="round"/>
    <rect x="161" y="72" width="10" height="12" rx="3" fill="#FFC21A"/>
  </g>
  <!-- Kutlamada kep havaya atılır: su fıskiyesi kepi yukarı kaldırır -->
  <g class="acc-kep mood-cheer" fill="#4F8DF9">
    <path d="M100 76 C99.5 66 99 56 100.5 49 C101.5 45 108.5 44 110.5 48 C112.5 55 112.5 66 112 76 Z"/>
    <path d="M103.5 51 C96 38 80 36 72 46 C71 48.5 73.5 50.5 75.5 49 C82 42 93 43 98 56 Z"/>
    <path d="M107 50 C112 40 126 37 134 45 C135.5 47 133.5 49.5 131.5 48.5 C125 43 116 45 112 55 Z"/>
    <circle cx="64" cy="40" r="4.8"/>
    <circle cx="144" cy="37" r="4.2"/>
    <circle cx="55" cy="52" r="3.2"/>
  </g>
  <path class="acc-kep mood-cheer" d="M104 68 L104 54" stroke="#9DC4FF" stroke-width="4" stroke-linecap="round"/>
  <g class="acc-kep mood-cheer" transform="translate(110 26) rotate(-12) scale(0.75)">
    <path d="M-46 12 C-46 -8 46 -8 46 12 Q0 22 -46 12 Z" fill="#2457D6"/>
    <polygon points="0,-16 60,0 0,16 -60,0" fill="#3D7BF7"/>
    <circle cx="0" cy="0" r="3.5" fill="#FFC21A"/>
    <path d="M0 0 L52 4 L54 22" fill="none" stroke="#FFC21A" stroke-width="3" stroke-linecap="round"/>
    <rect x="49" y="20" width="10" height="12" rx="3" fill="#FFC21A"/>
  </g>

  <!-- Yapraktan taç (7 günlük seri): bant başın içinde biter, ortası açık (fıskiye oradan çıkar) -->
  <g class="acc-tac">
    <path d="M0 0 C-7 -5 -7 -15 0 -20 C7 -15 7 -5 0 0 Z" fill="#6BCB3B" transform="translate(84 79) rotate(-35)"/>
    <path d="M0 -3 L0 -15" stroke="#3E8F22" stroke-width="2" stroke-linecap="round" transform="translate(84 79) rotate(-35)"/>
    <path d="M0 0 C-7 -5 -7 -15 0 -20 C7 -15 7 -5 0 0 Z" fill="#4FB52C" transform="translate(97 83) rotate(-14)"/>
    <path d="M0 -3 L0 -15" stroke="#3E8F22" stroke-width="2" stroke-linecap="round" transform="translate(97 83) rotate(-14)"/>
    <path d="M0 0 C-7 -5 -7 -15 0 -20 C7 -15 7 -5 0 0 Z" fill="#4FB52C" transform="translate(127 83) rotate(14)"/>
    <path d="M0 -3 L0 -15" stroke="#3E8F22" stroke-width="2" stroke-linecap="round" transform="translate(127 83) rotate(14)"/>
    <path d="M0 0 C-7 -5 -7 -15 0 -20 C7 -15 7 -5 0 0 Z" fill="#6BCB3B" transform="translate(141 79) rotate(35)"/>
    <path d="M0 -3 L0 -15" stroke="#3E8F22" stroke-width="2" stroke-linecap="round" transform="translate(141 79) rotate(35)"/>
    <path d="M80 75 Q112 89 145 75 C148 76 151 78 151 81 Q112 98 74 81 C74 78 77 76 80 75 Z" fill="#FFC21A"/>
    <path d="M79 81 Q112 95 146 81" fill="none" stroke="#E09B00" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
