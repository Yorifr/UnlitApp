<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" data-name="Nefes 2.0" data-default-stage="stage-1">
  <!-- Nefes 2.0: mevcut maskotun gelişmiş hali. Nane gövde, açık karın, yanaklar, başta filiz. -->
  <!-- Filiz 4 aşamada büyür: stage-1 (varsayılan; bugünkü Nefes gibi) minik, stage-2 4 yaprak, stage-3 dallı fidan, stage-4 çiçek. -->

  <!-- Yer gölgesi -->
  <ellipse cx="100" cy="186" rx="54" ry="6.5" fill="#000000" opacity="0.10"/>

  <!-- ===== KOLLAR (hepsi gövdenin ARKASINDA) ===== -->
  <!-- Neşeli ve sakin: iki kol yanlarda -->
  <g class="mood-happy mood-calm" fill="none" stroke="#1A9C90" stroke-width="18" stroke-linecap="round">
    <path d="M48 128 Q38 140 32 150"/>
    <path d="M152 128 Q162 140 168 150"/>
  </g>
  <!-- Düşünürken: kollar yanlarda (kalkık el "el sallıyor" gibi okunuyordu);
       düşünmeyi sağ üstteki üç mavi nokta anlatır (şapka takılıyken de görünür) -->
  <g class="mood-think" fill="none" stroke="#1A9C90" stroke-width="18" stroke-linecap="round">
    <path d="M48 128 Q38 140 32 150"/>
    <path d="M152 128 Q162 140 168 150"/>
  </g>
  <!-- Kutlamada iki kol havada -->
  <g class="mood-cheer" fill="none" stroke="#1A9C90" stroke-width="17" stroke-linecap="round">
    <path d="M50 116 Q36 98 32 78"/>
    <path d="M150 116 Q164 98 168 78"/>
  </g>
  <g class="mood-cheer" fill="#1A9C90">
    <circle cx="32" cy="72" r="10.5"/>
    <circle cx="168" cy="72" r="10.5"/>
  </g>

  <!-- Ayaklar -->
  <ellipse cx="76" cy="180" rx="16" ry="8" fill="#1A9C90"/>
  <ellipse cx="124" cy="180" rx="16" ry="8" fill="#1A9C90"/>

  <!-- Gövde: alttaki koyu ton (kenar/gölge), üstte asıl renk -->
  <ellipse cx="100" cy="125" rx="67" ry="59" fill="#1A9C90"/>
  <ellipse cx="100" cy="120" rx="67" ry="59" fill="#2EC4B6"/>
  <!-- Parlaklık (sol yan; şapkaların altında kalmasın diye biraz aşağıda) -->
  <ellipse cx="0" cy="0" rx="11" ry="6" fill="#FFFFFF" opacity="0.28" transform="translate(54 93) rotate(-56)"/>
  <!-- Karın -->
  <ellipse cx="100" cy="146" rx="42" ry="30" fill="#C9F3EC"/>
  <!-- Yanaklar -->
  <ellipse cx="55" cy="124" rx="10.5" ry="6.5" fill="#FF9EAA" opacity="0.8"/>
  <ellipse cx="145" cy="124" rx="10.5" ry="6.5" fill="#FF9EAA" opacity="0.8"/>

  <!-- ===== GÖZLER (güneş gözlüğü takılıyken camın arkasında kalır, çizilmez) ===== -->
  <!-- Açık gözler (beyazlar) -->
  <g class="mood-happy mood-cheer mood-think hide-acc-gozluk" fill="#FFFFFF">
    <circle cx="78" cy="104" r="16.5"/>
    <circle cx="122" cy="104" r="16.5"/>
  </g>
  <!-- Neşeli: göz bebekleri + iki parıltı -->
  <g class="mood-happy hide-acc-gozluk">
    <circle cx="79" cy="105.5" r="11" fill="#233A3A"/>
    <circle cx="123" cy="105.5" r="11" fill="#233A3A"/>
    <circle cx="75" cy="101" r="4.2" fill="#FFFFFF"/>
    <circle cx="119" cy="101" r="4.2" fill="#FFFFFF"/>
    <circle cx="83" cy="109.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="127" cy="109.5" r="1.8" fill="#FFFFFF"/>
  </g>
  <!-- Kutlama: "gülen gözler" (büyük parıltı, alt kısmı gövde renginde kapakla örtülü) -->
  <g class="mood-cheer hide-acc-gozluk">
    <circle cx="79" cy="105" r="11" fill="#233A3A"/>
    <circle cx="123" cy="105" r="11" fill="#233A3A"/>
    <circle cx="75" cy="100" r="5" fill="#FFFFFF"/>
    <circle cx="119" cy="100" r="5" fill="#FFFFFF"/>
    <!-- Gülen alt kapaklar -->
    <path d="M63.8 113 Q78 103 92.2 113 A16.8 16.8 0 0 1 63.8 113 Z" fill="#2EC4B6"/>
    <path d="M107.8 113 Q122 103 136.2 113 A16.8 16.8 0 0 1 107.8 113 Z" fill="#2EC4B6"/>
  </g>
  <!-- Düşünürken: gözler yukarı-sağa bakar -->
  <g class="mood-think hide-acc-gozluk">
    <circle cx="81" cy="99.5" r="10.5" fill="#233A3A"/>
    <circle cx="125" cy="99.5" r="10.5" fill="#233A3A"/>
    <circle cx="77.5" cy="95.5" r="3.8" fill="#FFFFFF"/>
    <circle cx="121.5" cy="95.5" r="3.8" fill="#FFFFFF"/>
    <circle cx="84.5" cy="103" r="1.6" fill="#FFFFFF"/>
    <circle cx="128.5" cy="103" r="1.6" fill="#FFFFFF"/>
  </g>
  <!-- Düşünürken kaşlar: ikisi de yukarı kavisli (merak), sağdaki biraz daha yüksek.
       Şapka ve taç kaşların yerini kapattığı için onlar takılıyken gizli. -->
  <g class="mood-think hide-acc-bere hide-acc-kep hide-acc-tac" fill="none" stroke="#233A3A" stroke-width="4.5" stroke-linecap="round">
    <path d="M67 80 Q78 72 89 79"/>
    <path d="M111 77 Q122 69 133 77"/>
  </g>
  <!-- Sakin: kapalı, huzurlu gözler -->
  <g class="mood-calm" fill="none" stroke="#233A3A" stroke-width="5.5" stroke-linecap="round">
    <path d="M65 107 Q78 96 91 107"/>
    <path d="M109 107 Q122 96 135 107"/>
  </g>

  <!-- ===== AĞIZLAR ===== -->
  <!-- Neşeli: küçük açık gülüş -->
  <path class="mood-happy" d="M88 124 Q100 127 112 124 Q111 139 100 139 Q89 139 88 124 Z" fill="#8A2E3B"/>
  <!-- Kutlama: kocaman gülüş + dil -->
  <g class="mood-cheer">
    <path d="M81 122 Q100 126 119 122 Q117 144 100 144 Q83 144 81 122 Z" fill="#8A2E3B"/>
    <path d="M90 138 Q100 131 110 138 Q100 144 90 138 Z" fill="#FF8A9A"/>
  </g>
  <!-- Sakin: yumuşak gülümseme -->
  <path class="mood-calm" d="M91 125 Q100 133 109 125" fill="none" stroke="#233A3A" stroke-width="5" stroke-linecap="round"/>
  <!-- Düşünceli: küçük, yana kaymış kapalı gülümseme -->
  <path class="mood-think" d="M92 128 Q99 132 107 126" fill="none" stroke="#233A3A" stroke-width="4.5" stroke-linecap="round"/>

  <!-- ===== AKSESUAR: Atkı (ağzın hemen altında, boyuna sarılı; solda sarkan uç) ===== -->
  <!-- Neşeli, sakin, düşünceli: yüksek atkı -->
  <g class="acc-atki mood-happy mood-calm mood-think">
    <path d="M38 133 Q100 155 162 133 L158 150 Q100 172 42 150 Z" fill="#3D7BF7"/>
    <path d="M42 150 Q100 172 158 150 L157 153 Q100 175 43 153 Z" fill="#2457D6"/>
    <!-- Sarkan uç -->
    <path d="M60 150 L78 153 L75 177 L57 174 Z" fill="#3D7BF7"/>
    <path d="M58.7 160 L76.7 163 L76.2 167 L58.2 164 Z" fill="#E2ECFF"/>
    <path d="M57.9 168 L75.9 171 L75.5 175 L57.5 172 Z" fill="#E2ECFF"/>
    <!-- Düğüm -->
    <ellipse cx="69" cy="150" rx="10" ry="7.5" fill="#2457D6"/>
  </g>
  <!-- Kutlama: ağız aşağı uzadığı için atkı biraz daha aşağıda -->
  <g class="acc-atki mood-cheer">
    <path d="M39 141 Q100 161 161 141 L157 155 Q100 175 43 155 Z" fill="#3D7BF7"/>
    <path d="M43 155 Q100 175 157 155 L156 158 Q100 178 44 158 Z" fill="#2457D6"/>
    <path d="M60 156 L78 159 L75 182 L57 179 Z" fill="#3D7BF7"/>
    <path d="M58.7 166 L76.7 169 L76.2 173 L58.2 170 Z" fill="#E2ECFF"/>
    <path d="M57.9 174 L75.9 177 L75.5 181 L57.5 178 Z" fill="#E2ECFF"/>
    <ellipse cx="69" cy="156" rx="10" ry="7.5" fill="#2457D6"/>
  </g>

  <!-- ===== AKSESUAR: Güneş gözlüğü (renkli çerçeve, mavi cam) ===== -->
  <!-- Neşeli, kutlama, düşünceli: gözlük gözlerde -->
  <g class="acc-gozluk mood-happy mood-cheer mood-think">
    <g fill="none" stroke="#8F57E0" stroke-width="4" stroke-linecap="round">
      <line x1="59" y1="100" x2="40" y2="97"/>
      <line x1="141" y1="100" x2="160" y2="97"/>
      <path d="M96 100 Q100 96.5 104 100"/>
    </g>
    <rect x="59" y="91" width="37" height="27" rx="13" fill="#2457D6" fill-opacity="0.9" stroke="#8F57E0" stroke-width="4"/>
    <rect x="104" y="91" width="37" height="27" rx="13" fill="#2457D6" fill-opacity="0.9" stroke="#8F57E0" stroke-width="4"/>
    <!-- Cam parlaması -->
    <g fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.6">
      <path d="M67 110 L76 97"/>
      <path d="M112 110 L121 97"/>
    </g>
  </g>
  <!-- Sakin: gözlük yine gözlerde ama camlar AÇIK renkli, kapalı ve huzurlu gözler
       camın arkasından görünsün. (Şapkayla birlikte de görünür; kazanılmış bir
       aksesuar hiçbir ruh halinde kaybolmasın.) -->
  <g class="acc-gozluk mood-calm">
    <g fill="none" stroke="#8F57E0" stroke-width="4" stroke-linecap="round">
      <line x1="59" y1="100" x2="40" y2="97"/>
      <line x1="141" y1="100" x2="160" y2="97"/>
      <path d="M96 100 Q100 96.5 104 100"/>
    </g>
    <rect x="59" y="91" width="37" height="27" rx="13" fill="#9DBBFF" fill-opacity="0.35" stroke="#8F57E0" stroke-width="4"/>
    <rect x="104" y="91" width="37" height="27" rx="13" fill="#9DBBFF" fill-opacity="0.35" stroke="#8F57E0" stroke-width="4"/>
  </g>

  <!-- ===== AKSESUAR: Kulaklık (bant başa oturur; kepin ve filizin arkasında) ===== -->
  <g class="acc-kulaklik">
    <path d="M36 96 A70 62 0 0 1 164 96" fill="none" stroke="#3D7BF7" stroke-width="7" stroke-linecap="round"/>
    <rect x="40" y="92" width="8" height="24" rx="4" fill="#E2ECFF"/>
    <rect x="152" y="92" width="8" height="24" rx="4" fill="#E2ECFF"/>
    <rect x="25" y="88" width="20" height="32" rx="9" fill="#3D7BF7"/>
    <rect x="155" y="88" width="20" height="32" rx="9" fill="#3D7BF7"/>
    <ellipse cx="31" cy="97" rx="2.5" ry="4" fill="#FFFFFF" opacity="0.45"/>
    <ellipse cx="161" cy="97" rx="2.5" ry="4" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- ===== AKSESUAR: Kep (filizin ARKASINDAKİ kısım: başlık + tabla) ===== -->
  <g class="acc-kep">
    <path d="M62 60 L62 72 Q100 92 138 72 L138 60 Z" fill="#1C46B0"/>
    <polygon points="48,58 100,71 152,58 152,62 100,75 48,62" fill="#2457D6"/>
    <polygon points="100,45 152,58 100,71 48,58" fill="#3D7BF7"/>
  </g>

  <!-- ===== FİLİZ: 4 büyüme aşaması ===== -->
  <!-- Aşama 1: minik filiz, iki yaprak (bere/kep yokken) -->
  <g class="stage-1 hide-acc-bere hide-acc-kep">
    <path d="M100 62 Q99 55 100 48" fill="none" stroke="#4AA32A" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4AA32A" transform="translate(100 49) rotate(-155) scale(0.75)"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4FB52C" transform="translate(100 49) rotate(-25) scale(0.75)"/>
  </g>
  <!-- Aşama 1, bere ya da kep takılıyken: filiz şapkanın tepesinden görünsün diye daha yukarıda -->
  <g class="stage-1 acc-bere acc-kep">
    <path d="M100 57 Q99 48 100 40" fill="none" stroke="#4AA32A" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4AA32A" transform="translate(100 41) rotate(-155) scale(0.75)"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4FB52C" transform="translate(100 41) rotate(-25) scale(0.75)"/>
  </g>
  <!-- Aşama 2: biraz büyümüş, 4 yaprak -->
  <g class="stage-2">
    <path d="M100 62 Q98 50 100 40" fill="none" stroke="#4AA32A" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4AA32A" transform="translate(99 55) rotate(-168) scale(0.55)"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4FB52C" transform="translate(100 52) rotate(-12) scale(0.6)"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4AA32A" transform="translate(100 43) rotate(-150) scale(1)"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4FB52C" transform="translate(100 41) rotate(-38) scale(1.4)"/>
  </g>
  <!-- Aşama 3 ve 4 ortak: uzun gövde ve iki dal -->
  <g class="stage-3 stage-4">
    <path d="M100 62 C97 50 103 38 100 27" fill="none" stroke="#4AA32A" stroke-width="6.5" stroke-linecap="round"/>
    <g fill="none" stroke="#4AA32A" stroke-width="4" stroke-linecap="round">
      <path d="M100 50 Q91 47 85 40"/>
      <path d="M101 40 Q108 37 113 30"/>
    </g>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4FB52C" transform="translate(100 56) rotate(-12) scale(0.55)"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4AA32A" transform="translate(100 44) rotate(-172) scale(0.5)"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4AA32A" transform="translate(85 40) rotate(-145) scale(1)"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4FB52C" transform="translate(113 30) rotate(-35) scale(1)"/>
  </g>
  <!-- Aşama 3: tepede iki yaprak -->
  <g class="stage-3">
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4AA32A" transform="translate(100 28) rotate(-125) scale(0.95)"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4FB52C" transform="translate(100 28) rotate(-62) scale(1.1)"/>
  </g>
  <!-- Aşama 4: tepede beş yapraklı yuvarlak mor çiçek, altın göbek -->
  <g class="stage-4">
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4AA32A" transform="translate(100 34) rotate(-165) scale(0.6)"/>
    <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" fill="#4FB52C" transform="translate(100 34) rotate(-15) scale(0.6)"/>
    <g fill="#B27CF7">
      <circle cx="100" cy="16" r="7.8"/>
      <circle cx="108.6" cy="22.2" r="7.8"/>
      <circle cx="105.3" cy="32.3" r="7.8"/>
      <circle cx="94.7" cy="32.3" r="7.8"/>
      <circle cx="91.4" cy="22.2" r="7.8"/>
    </g>
    <circle cx="100" cy="25" r="6.5" fill="#FFC21A"/>
    <circle cx="98" cy="23" r="2" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- ===== AKSESUAR: Kep (filizin ÖNÜNDEKİ kısım: düğme + püskül) ===== -->
  <g class="acc-kep">
    <path d="M100 58 L149 60 L149 74" fill="none" stroke="#FFC21A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="145.5" y="72" width="7" height="13" rx="3" fill="#FFC21A"/>
    <circle cx="100" cy="58" r="4.5" fill="#FFC21A"/>
  </g>

  <!-- ===== AKSESUAR: Bere (filiz berenin tepesinden çıkar) ===== -->
  <g class="acc-bere">
    <path d="M60 73 C56 50 76 43 100 43 C124 43 144 50 140 73 Z" fill="#B27CF7"/>
    <ellipse cx="0" cy="0" rx="10" ry="5" fill="#FFFFFF" opacity="0.25" transform="translate(80 54) rotate(-30)"/>
    <path d="M60 70 Q100 62 140 70 L155 85 Q100 75 45 85 Z" fill="#8F57E0"/>
    <!-- Örgü çizgileri -->
    <g stroke="#7440C9" stroke-width="3.5" stroke-linecap="round" opacity="0.6">
      <line x1="72" y1="70" x2="70" y2="79"/>
      <line x1="100" y1="68" x2="100" y2="77"/>
      <line x1="128" y1="70" x2="130" y2="79"/>
    </g>
    <!-- Filizin çıktığı delik -->
    <ellipse cx="100" cy="45.5" rx="6" ry="2.5" fill="#8F57E0"/>
  </g>

  <!-- ===== AKSESUAR: Defne tacı (altın yapraklar, 7 günlük seri) ===== -->
  <!-- Yapraklar dala paralel, uçları yana bakar (yukarı sivri değil). -->
  <g class="acc-tac">
    <!-- Tacın dalı -->
    <path d="M60 71 Q100 82 140 71" fill="none" stroke="#E09B00" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Alt sıra yapraklar (koyu altın, uçları yana ve hafif aşağı) -->
    <g fill="#E09B00">
      <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" transform="translate(91 76.2) rotate(162) scale(0.75 0.55)"/>
      <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" transform="translate(109 76.2) rotate(18) scale(0.75 0.55)"/>
      <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" transform="translate(80 75.1) rotate(162) scale(0.75 0.55)"/>
      <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" transform="translate(120 75.1) rotate(18) scale(0.75 0.55)"/>
      <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" transform="translate(69 73.2) rotate(162) scale(0.75 0.55)"/>
      <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" transform="translate(131 73.2) rotate(18) scale(0.75 0.55)"/>
    </g>
    <!-- Üst sıra yapraklar (açık altın, uçları yana) -->
    <g fill="#FFC21A">
      <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" transform="translate(91 76.2) rotate(-152) scale(0.75 0.55)"/>
      <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" transform="translate(109 76.2) rotate(-28) scale(0.75 0.55)"/>
      <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" transform="translate(80 75.1) rotate(-152) scale(0.75 0.55)"/>
      <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" transform="translate(120 75.1) rotate(-28) scale(0.75 0.55)"/>
      <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" transform="translate(69 73.2) rotate(-152) scale(0.75 0.55)"/>
      <path d="M0 0 C5 -8 14 -9 20 0 C14 9 5 8 0 0 Z" transform="translate(131 73.2) rotate(-28) scale(0.75 0.55)"/>
    </g>
    <!-- Dalın uçlarında altın toplar -->
    <circle cx="60" cy="71" r="3" fill="#E09B00"/>
    <circle cx="140" cy="71" r="3" fill="#E09B00"/>
    <!-- Ortadaki taş -->
    <circle cx="100" cy="76" r="6.5" fill="#E09B00"/>
    <circle cx="100" cy="76" r="4.5" fill="#FFC21A"/>
    <circle cx="98.5" cy="74.5" r="1.6" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Düşünme noktaları (sağ üstte, küçükten büyüğe) -->
  <g class="mood-think" fill="#3D7BF7">
    <circle cx="156" cy="74" r="3.5"/>
    <circle cx="166" cy="62" r="5"/>
    <circle cx="178" cy="48" r="6.5"/>
  </g>

  <!-- Kutlama parıltıları (dört köşeli yıldız) -->
  <g class="mood-cheer" fill="#FFC21A">
    <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(22 40) scale(0.8)"/>
    <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(178 42) scale(0.7)"/>
    <path d="M0 -10 Q2 -2 10 0 Q2 2 0 10 Q-2 2 -10 0 Q-2 -2 0 -10 Z" transform="translate(160 20) scale(0.5)"/>
  </g>
</svg>
