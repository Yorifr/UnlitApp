# Unlit — akıllı sigara kılıfı uygulaması
# Paket eklemeden önce CLAUDE.md'deki "Paket kuralları"nı oku!
name: unlit
description: "Akıllı sigara kılıfı için takip uygulaması"
publish_to: 'none' # pub.dev'e yayınlanmayacak

# Sürüm: 0.1.0 = görünen sürüm, +1 = derleme numarası.
# Değiştirirsen lib/app_info.dart içindeki appVersion'ı da güncelle.
version: 0.8.1+9

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Flutter'ın kendi Türkçe yazıları (Geri, Kapat, tarih seçici...) için.
  flutter_localizations:
    sdk: flutter
  # Verileri SADECE cihazda saklamak için (web'de tarayıcının localStorage'ı).
  shared_preferences: ^2.5.6
  # Telefonda (Android/iOS) ses efektlerini çalmak için.
  audioplayers: ^6.8.1
  # Web'de ses çalmak için tarayıcının Web Audio motoruna erişim
  # (Dart ekibinin resmi paketi). Bkz. lib/services/sound_player_web.dart
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Kod stil kuralları (flutter analyze bunları kontrol eder).
  flutter_lints: ^6.0.0

flutter:
  # Material ikonlarını (Icons.xxx) kullanabilmek için.
  uses-material-design: true

  # Ses efektleri (tool/make_sounds.py ile sıfırdan üretildi).
  assets:
    - assets/sounds/

  # Yuvarlak hatlı "Nunito" yazı tipi (SIL Open Font License, bkz.
  # assets/fonts/OFL.txt). Dosyalar uygulamanın içinde; internetten
  # indirilmez. Sadece Latin + Türkçe harfleri içerecek şekilde küçültüldü.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
